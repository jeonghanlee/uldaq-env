name: Debian 13

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  Debian13:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: debian:13-slim
    steps:
      - name: Install required packages
        run: |
          apt-get update
          apt-get install -y make gcc g++ libusb-1.0-0-dev autoconf autotools-dev git libtool patch sudo passwd util-linux ca-certificates
      - uses: actions/checkout@v7.0.1
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify source, patch lifecycle, and build entry points
        run: bash tests/test_build.bash --workspace /tmp/uldaq-ci-build --config-target conf
      - name: Prepare the container-local test user
        run: |
          useradd -m -s /bin/bash buildtest
          printf '%s\n' 'buildtest ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/uldaq-buildtest
          chmod 0440 /etc/sudoers.d/uldaq-buildtest
      - name: Verify ordinary-user ownership
        run: runuser -u buildtest -- bash "$GITHUB_WORKSPACE/tests/test_build.bash" --workspace /tmp/uldaq-ci-user --mode user
      - name: Verify protected-prefix installation
        run: runuser -u buildtest -- bash "$GITHUB_WORKSPACE/tests/test_build.bash" --workspace /tmp/uldaq-ci-protected --mode protected --protected-prefix /opt/uldaq-ci
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: uldaq-debian13-verification
          path: |
            /tmp/uldaq-ci-*/source.tsv
            /tmp/uldaq-ci-*/checks.tsv
            /tmp/uldaq-ci-*/commands.tsv
            /tmp/uldaq-ci-*/result.txt
            /tmp/uldaq-ci-*/*-installation.txt
            /tmp/uldaq-ci-*/logs/*.log
